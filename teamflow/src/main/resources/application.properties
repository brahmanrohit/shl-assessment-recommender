# ============================================================
#  APPLICATION CONFIGURATION
#  Everything Quarkus needs to know lives here.
#  Values like ${DB_URL:default} mean: use the DB_URL environment
#  variable if it exists, otherwise fall back to the default.
#  (Docker Compose sets those env vars; local dev uses the defaults.)
# ============================================================

# ---------- Database (MySQL) ----------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:taskuser}
quarkus.datasource.password=${DB_PASSWORD:taskpass}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/taskdb}

# ---------- Hibernate ORM (maps Java objects <-> DB tables) ----------
# drop-and-create rebuilds the tables on every startup and loads import.sql.
# Great for learning/demos. In PRODUCTION you would use "none" or "update"
# together with a migration tool like Flyway/Liquibase.
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
# Print the SQL Hibernate runs, so you can SEE what happens under the hood.
quarkus.hibernate-orm.log.sql=true

# ---------- HTTP server ----------
quarkus.http.port=8080

# ---------- API documentation ----------
# Swagger UI lets you try the API from the browser at /swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
# Adds an "Authorize" button in Swagger UI so you can paste a JWT and
# call the protected endpoints from the browser.
quarkus.smallrye-openapi.security-scheme=jwt

# ---------- Authentication (JWT) ----------
# We SIGN tokens with the private key and VERIFY them with the public key.
# The keys are generated (never committed to git): locally via openssl,
# and automatically inside the Docker build. See LEARN.md section 13.
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.publickey.location=jwt/publicKey.pem
# Tokens must carry this issuer, and we only accept tokens with it.
mp.jwt.verify.issuer=teamflow

# ---------- Bootstrap admin account ----------
# Created automatically at startup if it doesn't exist (see AdminBootstrap).
# Override these via environment variables in production.
app.admin.email=${ADMIN_EMAIL:admin@teamflow.local}
app.admin.password=${ADMIN_PASSWORD:admin1234}
app.admin.display-name=${ADMIN_DISPLAY_NAME:TeamFlow Admin}
